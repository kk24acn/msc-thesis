spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:servlet}
  application:
    name: blockchain-orchestrator

  # DB
  datasource:
    username: ${DB_USERNAME:kapellmeister}
    password: ${DB_PASSWORD:bach}
    sql:
      init:
        mode: ${DB_INIT_MODE:always}
        schema-locations: ${DB_SCHEMA_LOCATION:classpath:schema.sql}

  # Hardhat
  hardhat:
    rpc-url: ${HARDHAT_RPC_URL:http://127.0.0.1:8545}
    private-key: ${HARDHAT_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
    transaction-timeout: ${HARDHAT_TX_TIMEOUT:20s}
    max-retries: ${HARDHAT_MAX_RETRIES:3}
    retry-backoff: ${HARDHAT_RETRY_BACKOFF:300ms}
    receipt-poll-interval: ${HARDHAT_RECEIPT_POLL_INTERVAL:1s}
    gas-limit: ${HARDHAT_GAS_LIMIT:21000}
    chain-id: ${HARDHAT_CHAIN_ID:}
    recovery-concurrency: ${HARDHAT_RECOVERY_CONCURRENCY:4}
    recovery-interval-ms: ${HARDHAT_RECOVERY_INTERVAL_MS:30000}

  ssl:
    bundle:
      jks:
        sslclient:
          keystore:
            location: ${SSL_KEYSTORE_LOCATION:classpath:certs/orchestrator.p12}
            password: ${SSL_KEYSTORE_PASS:secret}
            type: ${SSL_KEYSTORE_TYPE:PKCS12}
          key:
            password: ${SSL_KEY_PASS:secret}
          truststore:
            location: ${SSL_TRUSTSTORE_LOCATION:classpath:certs/ca.p12}
            password: ${SSL_TRUSTSTORE_PASS:secret}

  grpc:
    client:
      channels:
        signer:
          ssl:
            bundle: sslclient
          address: ${SIGNER_RPC_URL:127.0.0.1:50051}
          negotiation-type: TLS