spring:
  datasource:
    username: sa
    password: password
    jdbcUrl: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driverClassName: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  hardhat:
    rpc-url: http://127.0.0.1:8545
    max-retries: 3
    gas-limit: 21000
    request-timeout: 10s
    retry-backoff: 300ms
    receipt-poll-interval: 1s

  mpc:
    signer-addresses: 127.0.0.1:50051,127.0.0.1:50052,127.0.0.1:50053
    dsg:
      max-retries: 3
      request-timeout: 10s
      eth-derivation-path: m/0