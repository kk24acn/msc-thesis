[package]
name = "blockchain-signer"
version = "0.1.0"
edition = "2024"
default-run = "blockchain-signer"

[dependencies]
tonic = {version="0.14.5", features = ["server", "_tls-any"]}
prost = "0.14.3"
tonic-prost = "0.14.5"
tokio = { version = "1.51.0", features = ["macros", "rt-multi-thread"] }
redb = "4.0.0"
bincode = "1.3"
dashmap = "6.1.0"
serde = { version = "1.0", features = ["derive"] }
dkls23-ll = { git = "https://github.com/silence-laboratories/silent-shard-dkls23-ll", branch = "main" }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
derivation-path = "0.2.0"
sha3 = "0.11.0"
hex = "0.4.3"
log = "0.4.29"
env_logger = "0.11.10"
clap = { version = "4.6.0", features = ["derive"] }
thiserror = "2.0.18"

[build-dependencies]
tonic-prost-build = "0.14.5"
