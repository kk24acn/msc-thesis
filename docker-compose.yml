services:
  postgres:
    image: postgres:18-alpine
    pull_policy: missing
    environment:
      POSTGRES_USER: kapellmeister
      POSTGRES_PASSWORD: bach
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    networks:
      - orchestrator
      - dashboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kapellmeister"]
      interval: 10s
      timeout: 5s
      retries: 5

  hardhat:
    build:
      context: ./hardhat-node
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    networks:
      - orchestrator
      - dashboard

  dashboard-postgrest:
    image: postgrest/postgrest
    pull_policy: missing
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://kapellmeister:bach@postgres:5432/orchestrator
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: kapellmeister
    networks:
      - dashboard
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

  dashboard-ui:
    build:
      context: ./ui-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./ui-dashboard:/app
    environment:
      - REACT_APP_POSTGREST_URL=http://localhost:3001
      - REACT_APP_HARDHAT_RPC_URL=http://localhost:8545
    networks:
      - dashboard
    depends_on:
      postgres:
        condition: service_healthy
      hardhat:
        condition: service_started

  signer-1:
    build:
      context: ./blockchain-signer
      dockerfile: Dockerfile
      additional_contexts:
        shared_proto: ./util/proto
    environment:
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--party-id", "1", "--db-path", "/app/data/node.redb"]
    ports:
      - "50051:50051"
    volumes:
      - signer1_data:/app/data
    networks:
      - signer

  signer-2:
    build:
      context: ./blockchain-signer
      dockerfile: Dockerfile
      additional_contexts:
        shared_proto: ./util/proto
    environment:
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--party-id", "2", "--db-path", "/app/data/node.redb"]
    ports:
      - "50052:50051"
    volumes:
      - signer2_data:/app/data
    networks:
      - signer

  signer-3:
    build:
      context: ./blockchain-signer
      dockerfile: Dockerfile
      additional_contexts:
        shared_proto: ./util/proto
    environment:
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--party-id", "3", "--db-path", "/app/data/node.redb"]
    ports:
      - "50053:50051"
    volumes:
      - signer3_data:/app/data
    networks:
      - signer

  orchestrator:
    build:
      context: ./blockchain-orchestrator
      dockerfile: Dockerfile
      additional_contexts:
          shared_proto: ./util/proto
    ports:
      - "8080:8080"
    environment:
      - DB_JDBC_URL=jdbc:postgresql://postgres:5432/orchestrator
      - DB_USERNAME=kapellmeister
      - DB_PASSWORD=bach
      - HARDHAT_RPC_URL=http://hardhat:8545
      - SIGNER_RPC_URLS=faultlab-proxy-1:50051,faultlab-proxy-2:50051,faultlab-proxy-3:50051
      - GRPC_CONCURRENCY_LIMIT=50
    networks:
      - signer
      - orchestrator
    depends_on:
      postgres:
        condition: service_healthy
      hardhat:
        condition: service_started
      signer-1:
        condition: service_started
      signer-2:
        condition: service_started
      signer-3:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  faultlab-proxy-1:
    build:
      context: ./faultlab
      dockerfile: Dockerfile
      args:
        SIGNER_HOST: signer-1
        SIGNER_PORT: 50051
    ports:
      - "55551:50051"
      - "5001:5000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - signer
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  faultlab-proxy-2:
    build:
      context: ./faultlab
      dockerfile: Dockerfile
      args:
        SIGNER_HOST: signer-2
        SIGNER_PORT: 50051
    ports:
      - "55552:50051"
      - "5002:5000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - signer
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  faultlab-proxy-3:
    build:
      context: ./faultlab
      dockerfile: Dockerfile
      args:
        SIGNER_HOST: signer-3
        SIGNER_PORT: 50051
    ports:
      - "55553:50051"
      - "5003:5000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - signer
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  signer1_data:
    driver: local
  signer2_data:
    driver: local
  signer3_data:
    driver: local

networks:
  orchestrator:
    driver: bridge
  dashboard:
    driver: bridge
  signer:
    driver: bridge