[project]
name = "faultlab"
version = "0.1.0"
description = "Python Fault Injection Framework for testing blockchain orchestrator resilience"
authors = [
    {name = "Kyrylo Kostakov", email = "kk24acn@herts.ac.uk"}
]
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "flask>=3.0.0,<4.0.0",
    "psycopg[binary]>=3.3.3",
    "sqlalchemy>=2.0.48",
    "pandas>=3.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "web3>=7.0.0,<8.0.0",
    "eth-account>=0.9.0,<1.0.0",
    "docker>=7.1.0",
    "tqdm>=4.67.3"
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "mypy-protobuf>=5.1.0"
]

