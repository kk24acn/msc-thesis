[pytest]
env_files =
    .env
asyncio_default_fixture_loop_scope = session
log_cli = true
log_cli_level = INFO
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
pythonpath = . src
asyncio_mode = auto
addopts = -v
filterwarnings =
    ignore::DeprecationWarning:websockets.legacy
norecursedirs = .git .venv venv
markers = 
    setup: mark test as a setup test (runs DKG initialization)
    inject_fault: triggers fault injection on proxy before test execution and resets fault configuration after test completion
    blockchain_refresh: triggers full blockchain refresh (hardhat + orchestrator restart, transactions table truncation, account funding)
    collect_db_state: polls transactions table after test until all rows are terminal, then saves CSV to tests/results/